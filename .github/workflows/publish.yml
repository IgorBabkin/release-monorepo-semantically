name: publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating releases and tags
  issues: write # Required for creating issue comments
  pull-requests: write # Required for creating PR comments
  packages: write # Required for publishing to GitHub Packages

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:e2e

      - name: Upload build artifact
        uses: ./.github/actions/upload-build-artifact

  publish:
    name: release
    needs: build
    environment:
      name: production
      url: https://www.npmjs.com/package/release-monorepo-semantically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist

      # OIDC authentication is automatically used when:
      # 1. permissions.id-token: write is set (see top of file)
      # 2. npm 11.5.1+ is installed (Node 25's bundled npm already satisfies this)
      # 3. Trusted Publishing is configured in npm account settings
      - name: Check npm version
        run: npm --version

      - run: pnpm install --frozen-lockfile

      - name: Configure Git
        uses: ./.github/actions/configure-git-bot

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
