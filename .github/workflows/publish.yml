name: publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating releases and tags
  issues: write # Required for creating issue comments
  pull-requests: write # Required for creating PR comments
  packages: write # Required for publishing to GitHub Packages

jobs:
  publish:
    name: release
    environment:
      name: production
      url: https://www.npmjs.com/package/release-monorepo-semantically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Configure Git
        uses: ./.github/actions/configure-git-bot

      # OIDC authentication is automatically used when:
      # 1. permissions.id-token: write is set (see top of file)
      # 2. npm 11.5.1+ is installed (Node 25's bundled npm already satisfies this)
      # 3. Trusted Publishing is configured in npm account settings
      - name: Build, test, and release
        env:
          RELEASE_TOKEN: ${{ github.token }}
          HUSKY: '0' # `pnpm install` runs husky's prepare, which would re-enable hooks disabled by configure-git-bot
        run: |
          npm --version
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build
          pnpm run test:e2e
          GITHUB_TOKEN="$RELEASE_TOKEN" npx semantic-release
