name: Configure Git bot credentials
description: Sets the committer identity used for automated commits and tags, and disables git hooks on CI

inputs:
  user-name:
    description: Git committer name
    required: false
    default: 'github-actions[bot]'
  user-email:
    description: Git committer email
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config user.name "${{ inputs.user-name }}"
        git config user.email "${{ inputs.user-email }}"
        git config core.hooksPath /dev/null  # Disable git hooks on CI
